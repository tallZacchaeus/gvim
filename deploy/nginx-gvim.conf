# nginx site for GVIM. Installed to /etc/nginx/sites-available/gvim.
#
# nginx serves the built SPA and the media directly; only /api reaches Node.
# A crash in the API therefore takes out the admin and the forms, not the
# public site.
#
# Certbot rewrites this file when it issues a certificate, adding the
# listen 443 / ssl_certificate lines and the port-80 redirect.

upstream gvim_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    server_tokens off;
    # Must exceed the 50 MB per-file cap the API enforces, with headroom for
    # multipart overhead — otherwise nginx rejects the upload before Node can
    # return a useful message.
    client_max_body_size 56m;

    root /srv/gvim/app/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Uploaded photographs and audio. Immutable: every key carries a random
    # id, so a given URL's bytes never change.
    location /media/ {
        alias /var/lib/gvim/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Media must never be interpreted as a document.
        add_header Content-Security-Policy "default-src 'none'" always;
        try_files $uri =404;
    }

    # Hashed build output.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gvim_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # A 50 MB upload over mobile data can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # SPA fallback. Replaces the vercel.json rewrite; the app's own catch-all
    # route renders the 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
